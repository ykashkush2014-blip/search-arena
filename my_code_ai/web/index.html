<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مساعدي للبرمجة · My Code AI</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e;
          --accent:#3fb950; --user:#1f6feb; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); display:flex; flex-direction:column;
         font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center;
           gap:12px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:18px; }
  .badge { font-size:12px; padding:3px 9px; border-radius:999px; border:1px solid var(--border);
           color:var(--muted); text-decoration:none; }
  .badge.ok { color:var(--accent); border-color:#238636; }
  #chat { flex:1; overflow-y:auto; padding:20px; }
  .wrap { max-width:860px; margin:0 auto; }
  .msg { display:flex; gap:10px; margin:14px 0; align-items:flex-start; }
  .avatar { width:32px; height:32px; border-radius:50%; display:grid; place-items:center;
            flex:none; font-size:17px; background:#21262d; border:1px solid var(--border); }
  .bubble { padding:11px 15px; border-radius:12px; line-height:1.7; max-width:calc(100% - 50px);
            white-space:pre-wrap; word-break:break-word; unicode-bidi:plaintext; }
  .user .bubble { background:var(--user); color:white; }
  .bot .bubble { background:var(--panel); border:1px solid var(--border); }
  .bubble code { background:rgba(110,118,129,.25); padding:1px 5px; border-radius:5px;
                 font-family:ui-monospace, Consolas, monospace; font-size:.92em; direction:ltr; unicode-bidi:isolate; }
  .codebox { direction:ltr; text-align:left; margin:8px 0; border:1px solid var(--border);
             border-radius:8px; overflow:hidden; white-space:normal; }
  .codebox .bar { display:flex; justify-content:space-between; align-items:center; padding:5px 10px;
                  background:#0b0f14; color:var(--muted); font-size:12px; border-bottom:1px solid var(--border); }
  .codebox pre { margin:0; padding:12px; background:#0b0f14; overflow-x:auto; white-space:pre;
                 font-family:ui-monospace, "JetBrains Mono", Consolas, monospace; font-size:13.5px; line-height:1.55; }
  .copy { background:none; border:1px solid var(--border); color:var(--muted); border-radius:5px;
          font-size:11px; padding:2px 8px; cursor:pointer; }
  .kw { color:#ff7b72; } .str { color:#a5d6ff; } .com { color:#8b949e; font-style:italic; }
  .num { color:#79c0ff; } .fn { color:#d2a8ff; }
  footer { border-top:1px solid var(--border); padding:14px 20px; }
  form { display:flex; gap:10px; }
  textarea { flex:1; resize:none; background:var(--panel); color:var(--text); border:1px solid var(--border);
             border-radius:10px; padding:12px; font:inherit; font-size:15px; height:52px; max-height:160px;
             unicode-bidi:plaintext; }
  textarea:focus { outline:none; border-color:#58a6ff; }
  button.send { background:#238636; color:white; border:0; border-radius:10px; padding:0 20px;
                font-size:15px; cursor:pointer; font-family:inherit; }
  button.send:disabled { opacity:.5; cursor:wait; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .chip { background:#21262d; border:1px solid var(--border); color:var(--text); border-radius:999px;
          padding:6px 12px; font-size:13px; cursor:pointer; font-family:inherit; unicode-bidi:plaintext; }
  .chip:hover { border-color:#58a6ff; }
  .welcome { text-align:center; color:var(--muted); margin:40px 0 10px; line-height:1.9; }
  .welcome h2 { color:var(--text); margin-bottom:4px; }
  .typing::after { content:"▍"; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity:0; } }
</style>
</head>
<body>
<header>
  <h1>🤖 مساعدي الخاص للبرمجة</h1>
  <span class="badge ok">مبني من الصفر · بدون أي نموذج آخر</span>
  <span class="badge" id="status">جارٍ التحميل…</span>
  <a class="badge" href="complete">⌨️ إكمال الكود</a>
</header>
<div id="chat"><div class="wrap" id="msgs">
  <div class="welcome">
    <h2>أهلًا! 👋 Hi!</h2>
    اطلب مني أكتبلك كود، أو اسألني عن مفهوم برمجي — بالعربي أو بالإنجليزي.<br>
    Ask me to write code or explain a programming concept — in Arabic or English.
    <div class="chips" id="chips" style="justify-content:center"></div>
  </div>
</div></div>
<footer><div class="wrap">
  <form id="f">
    <textarea id="inp" placeholder="اكتب طلبك هون… مثلًا: اكتب دالة بتفحص إذا الرقم أولي" autofocus></textarea>
    <button class="send" id="send">إرسال</button>
  </form>
</div></footer>
<script>
const $ = id => document.getElementById(id);
const SUGGEST = ["اكتب دالة بتفحص إذا الرقم أولي", "Write a function that reverses a string",
  "اعمل كلاس اسمه Car فيه brand و year", "شو يعني dictionary؟", "print numbers from 1 to 20",
  "اعملي لعبة تخمين رقم", "binary search بجافاسكربت", "مين انت؟"];
SUGGEST.forEach(s => { const b = document.createElement("button"); b.className = "chip";
  b.textContent = s; b.onclick = () => send(s); $("chips").appendChild(b); });

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const KW = /\b(def|return|if|elif|else|for|while|in|not|and|or|import|from|class|try|except|finally|with|as|True|False|None|lambda|function|const|let|var|new|of|break|continue|pass|yield|raise|is|async|await|null|true|false)\b/g;
function highlight(code) {
  // tokenise strings & comments first so keywords inside them aren't coloured
  const re = /("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`[^`]*`|#[^\n]*|\/\/[^\n]*)/g;
  let out = "", last = 0, m;
  const plain = s => esc(s).replace(KW, '<span class="kw">$1</span>')
                           .replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="num">$1</span>')
                           .replace(/\b([a-zA-Z_]\w*)(?=\()/g, '<span class="fn">$1</span>');
  while ((m = re.exec(code))) {
    out += plain(code.slice(last, m.index));
    const t = m[0];
    out += (t[0] === "#" || t.startsWith("//")) ? `<span class="com">${esc(t)}</span>` : `<span class="str">${esc(t)}</span>`;
    last = m.index + t.length;
  }
  return out + plain(code.slice(last));
}
function render(text) {
  const parts = text.split(/```(\w*)\n?/);
  let html = "";
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 0) {
      // text segment (an odd number of fences means a code block is still streaming)
      html += esc(parts[i].replace(/^\n+|\n+$/g, "")).replace(/`([^`\n]+)`/g, "<code>$1</code>");
    } else {
      const lang = parts[i] || "code"; const code = (parts[i + 1] || "").replace(/\n$/, ""); i++;
      html += `<div class="codebox"><div class="bar"><span>${lang}</span><button class="copy">نسخ</button></div><pre>${highlight(code)}</pre></div>`;
    }
  }
  return html;
}
function add(role, text) {
  document.querySelector(".welcome")?.remove();
  const d = document.createElement("div"); d.className = "msg " + role;
  d.innerHTML = `<div class="avatar">${role === "user" ? "👤" : "🤖"}</div><div class="bubble"></div>`;
  $("msgs").appendChild(d);
  const b = d.querySelector(".bubble");
  if (role === "user") b.textContent = text; else b.innerHTML = render(text);
  $("chat").scrollTop = $("chat").scrollHeight;
  return b;
}
document.addEventListener("click", e => {
  if (e.target.classList.contains("copy")) {
    navigator.clipboard.writeText(e.target.closest(".codebox").querySelector("pre").innerText);
    e.target.textContent = "✓ نُسخ"; setTimeout(() => e.target.textContent = "نسخ", 1500);
  }
});

async function send(text) {
  text = (text ?? $("inp").value).trim(); if (!text) return;
  $("inp").value = ""; add("user", text);
  const b = add("bot", ""); b.classList.add("typing");
  $("send").disabled = true;
  let full = "";
  try {
    const r = await fetch("api/chat", { method:"POST", headers:{"Content-Type":"application/json"},
                                        body: JSON.stringify({message:text}) });
    if (!r.ok) { full = "⚠️ " + await r.text(); }
    else {
      const reader = r.body.getReader(), dec = new TextDecoder();
      while (true) {
        const {done, value} = await reader.read(); if (done) break;
        full += dec.decode(value, {stream:true}); b.innerHTML = render(full);
        $("chat").scrollTop = $("chat").scrollHeight;
      }
    }
  } catch (e) { full += "\n⚠️ " + e; }
  b.classList.remove("typing"); b.innerHTML = render(full || "…");
  $("send").disabled = false; $("inp").focus();
}
$("f").onsubmit = e => { e.preventDefault(); send(); };
$("inp").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

async function info() {
  try {
    const d = await (await fetch("api/chat_info")).json();
    if (!d.ready) { $("status").textContent = "النموذج قيد التدريب…"; return; }
    $("status").className = "badge ok";
    $("status").textContent = `جاهز ✓ · ${(d.params/1e6).toFixed(1)}M معامل · ${d.iter} خطوة تدريب`;
  } catch (e) { $("status").textContent = "خطأ في الاتصال"; }
}
info(); setInterval(info, 30000);
</script>
</body>
</html>
